name: PR title

# release-please builds the changelog from squash-merged PR titles,
# so titles must follow Conventional Commits (feat:, fix:, chore:, docs:, ...).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
